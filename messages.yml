  create-failed: "&cFailed to create NPC!"
  remove-failed: "&cFailed to remove NPC!"
  moved: "&aNPC '{name}' moved to your location!"
  move-failed: "&cFailed to move NPC!"
  teleported: "&aTeleported to NPC '{name}'!"
  skin-set: "&aNPC '{name}' skin set to '{skin}'!"
  skin-failed: "&cFailed to set NPC skin!"
  type-set: "&aNPC '{name}' type set to '{type}'!"
  type-failed: "&cFailed to set NPC type!"
  hologram-set: "&aNPC '{name}' hologram set!"
  hologram-removed: "&aNPC '{name}' hologram removed!"
  hologram-failed: "&cFailed to set NPC hologram!"
  hologram-remove-failed: "&cFailed to remove NPC hologram!"
  command-set: "&aNPC '{name}' command set!"
  server-set: "&aNPC '{name}' server set to '{server}'!"
  id-set: "&aNPC '{name}' ID set to {id}!"
  id-failed: "&cFailed to set NPC ID! ID may already be in use."
  invalid-id: "&cInvalid ID! Please enter a valid number."
  look-enabled: "&aNPC '{name}' will now look at players!"
  look-disabled: "&cNPC '{name}' will no longer look at players!"
  no-npcs: "&cNo NPCs found!"
  list-header: "&6&lNPC List:"
  info-header: "&6&lNPC Information for '{name}':"
  help-header: "&6&lNPC Commands Help:"

# Error Messages
errors:
  config-error: "&cError loading configuration file!"
  database-error: "&cDatabase error occurred!"
  command-error: "&cAn error occurred while executing the command!"
  teleport-error: "&cTeleport failed! Please try again."
  world-not-found: "&cWorld '{world}' not found!"
  location-unsafe: "&cDestination location is unsafe!"
